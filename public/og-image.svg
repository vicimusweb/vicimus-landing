<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="orb" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#A3E635" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg { fill: #0A0A0A; }
      .text { fill: #F5F5F4; }
      .muted { fill: #A8A29E; }
      .accent { fill: #A3E635; }
      .border { stroke: #292524; stroke-width: 1; }
      .display { font-family: 'Geist', Inter, system-ui, -apple-system, sans-serif; font-weight: 500; }
      .mono { font-family: 'Geist Mono', 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#orb)"/>

  <!-- Inner hairline border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" class="border"/>

  <!-- Eyebrow -->
  <text class="mono accent" x="80" y="120" font-size="14">
    // SOFTWARE DEVELOPMENT &#183; DIGITAL SOLUTIONS
  </text>

  <!-- Wordmark VICIMUS -->
  <text class="display text" x="80" y="290" font-size="140" letter-spacing="-7">VICIMUS</text>

  <!-- Headline -->
  <text class="display text" x="80" y="380" font-size="40" letter-spacing="-1.5" opacity="0.92">
    Ahol a technológia üzleti
  </text>
  <text class="display text" x="80" y="430" font-size="40" letter-spacing="-1.5" opacity="0.92">
    értékké válik.
  </text>

  <!-- Pill capabilities -->
  <g class="mono muted" font-size="12">
    <g transform="translate(80, 490)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="none" class="border"/>
      <text x="77.5" y="22" text-anchor="middle">[ EGYEDI SZOFTVER ]</text>
    </g>
    <g transform="translate(247, 490)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="none" class="border"/>
      <text x="77.5" y="22" text-anchor="middle">[ WEB &amp; PLATFORM ]</text>
    </g>
    <g transform="translate(414, 490)">
      <rect x="0" y="0" width="125" height="34" rx="17" fill="none" class="border"/>
      <text x="62.5" y="22" text-anchor="middle">[ INTEGRÁCIÓ ]</text>
    </g>
    <g transform="translate(551, 490)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="none" class="border"/>
      <text x="67.5" y="22" text-anchor="middle">[ ADATELEMZÉS ]</text>
    </g>
  </g>

  <!-- Bottom-right URL -->
  <text class="mono accent" x="1120" y="560" font-size="14" text-anchor="end">VICIMUSSOLUTIONS.COM ↗</text>
  <text class="mono muted" x="80" y="560" font-size="12">BUCHAREST · ROMANIA</text>
</svg>
